{% set name = "cellpy" %}
{% set version = "2.1.1.post1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a7b1ebd8aef59a3865e51bde4060e629f95eb8f32818994048845c935156f041

build:
  number: 0
  # cellpy requires-python >=3.13
  skip: true  # [py<313]
  entry_points:
    - cellpy=cellpy.cli:cli
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    # build-system from pyproject.toml (linter wants an explicit backend)
    - hatchling >=1.27
    - uv-dynamic-versioning >=0.7.0
  run:
    - python
    # PyPI [project.dependencies] (conda names) — cellpy 2.1.0
    - cellpycore ==0.2.4
    - charset-normalizer
    - cookiecutter
    - dateparser
    - defusedxml
    - jinja2-time
    - matplotlib-base
    - numpy
    - openpyxl
    - pandas >=3.0.3,<4
    - paramiko >=5.0.0
    - pint
    - platformdirs >=4.10.0
    - polars
    - pyarrow >=16
    - pydantic-settings >=2.14.2
    - pygithub
    - pyodbc
    - python-isal
    - pyyaml
    - requests
    - rich
    - scipy
    - setuptools
    - sqlalchemy >=2.0.0
    - tqdm
    - typer
    - universal-pathlib >=0.3.10
    - xmltodict
    - sqlalchemy-access >=2.0.2  # [win]
    # Conda UX extras historically bundled with cellpy (optional on PyPI)
    - hdf5 >=1.14
    - ipykernel
    - ipython
    - ipywidgets
    - jupyterlab
    - lmfit
    - plotly
    - python-kaleido >=0.1.0,<1.4
    - pytables
    - seaborn
    - xlrd >=2.0.1

test:
  imports:
    - cellpy
    - cellpycore
  commands:
    - cellpy --help
    - cellpy info --version

about:
  home: https://github.com/jepegit/cellpy
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Extract and manipulate data from different battery cell testers.
  description: |
    Extract and manipulate data from different battery cell testers.
  doc_url: https://cellpy.readthedocs.io/
  dev_url: https://github.com/jepegit/cellpy

extra:
  recipe-maintainers:
    - jepegit
